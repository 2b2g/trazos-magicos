# Trazos Mágicos — despliegue de un contenedor
#
#   con plugin compose:   docker compose up -d --build
#   sin plugin:           docker build -t trazos-magicos:latest . && docker run -d --name trazos -p 8080:8080 trazos-magicos:latest
#
# HTTPS: pon detrás un reverse proxy (Caddy/Traefik/NPM). El service
# worker del juego solo se registra bajo https:// (o localhost).

services:
  trazos:
    build: .
    image: trazos-magicos:latest
    container_name: trazos-magicos
    ports:
      - "8080:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
